  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="A daily air-mail route: a chain letter, a rotating puzzle, the postal scale, and a mystery sender.">
  <meta name="theme-color" content="#1f3b33">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-title" content="Postmarked">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='6' width='28' height='20' rx='2' fill='%23f4ecd8'/><path d='M2 8l14 10 14-10' fill='none' stroke='%23b8282e' stroke-width='3'/></svg>">

<body>
  <div class="airmail-band" aria-hidden="true"></div>

    <a class="wordmark" href="./" aria-label="Postmarked home">Postmarked</a>

    </div>
    <button class="mute" id="mute" aria-label="Toggle sound"></button>
  </header>

  <main id="stage" class="stage" aria-live="polite"></main>
